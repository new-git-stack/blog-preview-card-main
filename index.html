<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
  <title>Frontend Mentor | Blog preview card</title>

  <style>
    :root {
      --yellow: hsl(47, 88%, 63%);
      --gray: hsl(0, 0%, 42%);
      --black-basically: hsl(0, 0%, 7%)
    }

    body {
      font-family: Figtree;
      font-weight: 500;
      background-color: var(--yellow);
      height: 98svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--black-basically);
    }

    p {
      margin: 0;
      margin: 10px 0;
    }

    .blog-card {
      width: 330px;
      background-color: white;
      border: 1px solid var(--black-basically);
      border-radius: 20px;
      box-shadow: 10px 10px var(--black-basically);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .hero-image {
      border-radius: 20px;
      width: auto;
      object-fit: cover;
    }

    .status {
      background-color: var(--yellow);
      padding: 10px;
      margin-top: 20px;
      width: fit-content;
      border-radius: 5px;
      font-weight: 800;
    }

    .date {
      margin-top: 5px;
      font-size: 16px;
    }

    .title {
      margin: 10px 0;
      font-weight: 800;
      font-size: 1.3rem;
      transition: .1s ease-in-out;
    }

    .title:hover {
      color: var(--yellow);
    }

    .info {
      color: var(--gray);
      font-size: 16px;
    }

    .instructor-info {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }

    .instructor-picture {
      width: 40px;
    }

    .instructor-name {
      font-weight: 800;
      padding-left: 10px;
    }

  </style>
</head>
<body>

  <div class="blog-card">
    <img src="assets/images/illustration-article.svg" alt="hero-image" class="hero-image">

    <p class="status">
      Learning
    </p>

    <p class="date">
      Published 21 Dec 2023
    </p>

    <p class="title">
      HTML & CSS foundations
    </p>

    <p class="info">
      These languages are the backbone of every <br> website, defining structure, content, and <br> presentation.
    </p>

    <div class="instructor-info">
      <img src="assets/images/image-avatar.webp" alt="instructor-picture" class="instructor-picture">
      <p class="instructor-name">Greg Hooper</p>
    </div>
  </div>
</body>
</html>
